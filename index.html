<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIGC 竞品周报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['SF Mono', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .img-cover { object-fit: cover; }
        a.ext-link { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: #ccc; }
        a.ext-link:hover { text-decoration-color: #000; }
    </style>
</head>
<body class="bg-white text-black min-h-screen" x-data="app()" x-cloak>

    <!-- Header -->
    <header class="border-b border-black/10 sticky top-0 z-50 bg-white/95 backdrop-blur-sm">
        <div class="max-w-4xl mx-auto px-6 py-5 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold tracking-tight">AIGC 竞品周报</h1>
                <p class="text-xs text-black/40 mt-0.5 font-mono">AMS · Ad Marketing Services</p>
            </div>
            <select x-model="currentWeek" @change="loadWeek()" 
                class="text-sm border border-black/15 rounded px-3 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-black/20 font-mono">
                <template x-for="w in weeks" :key="w.id">
                    <option :value="w.id" x-text="w.period"></option>
                </template>
            </select>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-4xl mx-auto px-6 py-10 space-y-16" x-show="data" x-transition>

        <!-- Headline -->
        <section class="fade-in">
            <div class="border border-black/10 rounded-lg overflow-hidden">
                <template x-if="data.headline.image">
                    <img :src="data.headline.image" :alt="data.headline.title" class="w-full h-48 sm:h-64 img-cover bg-black/5">
                </template>
                <div class="p-6 sm:p-8">
                    <p class="text-xs font-mono text-black/40 mb-2" x-text="data.period"></p>
                    <h2 class="text-2xl sm:text-3xl font-bold tracking-tight leading-tight" x-text="data.headline.title"></h2>
                    <p class="text-base text-black/60 mt-3 leading-relaxed" x-text="data.headline.summary"></p>
                    <template x-if="data.headline.link">
                        <a :href="data.headline.link" target="_blank" class="inline-block mt-4 text-sm ext-link text-black/70 hover:text-black">
                            阅读原文 →
                        </a>
                    </template>
                </div>
            </div>
        </section>

        <!-- Competitors -->
        <section>
            <h3 class="text-xs font-mono uppercase tracking-widest text-black/40 mb-8">竞品动态</h3>
            <div class="space-y-12">
                <template x-for="(comp, idx) in data.competitors" :key="comp.name">
                    <article class="fade-in" :style="'animation-delay:' + (idx * 100) + 'ms'">
                        <!-- Competitor Name -->
                        <div class="flex items-center gap-3 mb-5">
                            <span class="text-2xl" x-text="comp.logo_emoji"></span>
                            <div>
                                <h4 class="text-lg font-bold" x-text="comp.name"></h4>
                                <span class="text-xs text-black/40" x-text="comp.company"></span>
                            </div>
                        </div>
                        <!-- Updates -->
                        <div class="space-y-4">
                            <template x-for="u in comp.updates" :key="u.title">
                                <div class="hover-lift rounded-lg p-4 border border-black/5">
                                    <!-- Type + Impact -->
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-black/5 text-black/60" x-text="u.type"></span>
                                        <span class="text-[11px] font-mono text-black/30" x-text="u.impact === 'high' ? '● HIGH' : u.impact === 'medium' ? '○ MED' : '· LOW'"></span>
                                    </div>
                                    <!-- Title -->
                                    <h5 class="text-base font-semibold mt-1" x-text="u.title"></h5>
                                    <!-- Detail -->
                                    <p class="text-sm text-black/55 mt-1 leading-relaxed" x-text="u.detail"></p>
                                    <!-- Image -->
                                    <template x-if="u.image">
                                        <img :src="u.image" :alt="u.title" class="mt-3 rounded w-full h-40 img-cover bg-black/5">
                                    </template>
                                    <!-- Case Study -->
                                    <template x-if="u.case">
                                        <div class="mt-3 bg-black/[0.02] border border-black/5 rounded p-3">
                                            <p class="text-xs font-mono text-black/40 mb-1">案例</p>
                                            <p class="text-sm text-black/70" x-text="u.case.desc"></p>
                                            <template x-if="u.case.image">
                                                <img :src="u.case.image" :alt="u.case.desc" class="mt-2 rounded w-full h-32 img-cover bg-black/5">
                                            </template>
                                        </div>
                                    </template>
                                    <!-- Link -->
                                    <template x-if="u.link">
                                        <a :href="u.link" target="_blank" class="inline-block mt-2 text-xs ext-link text-black/50 hover:text-black font-mono">
                                            查看详情 ↗
                                        </a>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </article>
                </template>
            </div>
        </section>

        <!-- Divider -->
        <hr class="border-black/5">

        <!-- Trends -->
        <section class="fade-in">
            <h3 class="text-xs font-mono uppercase tracking-widest text-black/40 mb-6">趋势洞察</h3>
            <div class="space-y-5">
                <template x-for="(t, i) in data.trends" :key="t.title">
                    <div class="flex gap-4">
                        <span class="flex-shrink-0 w-7 h-7 border border-black/15 rounded-full flex items-center justify-center text-xs font-mono font-bold" x-text="i+1"></span>
                        <div>
                            <p class="font-semibold" x-text="t.title"></p>
                            <p class="text-sm text-black/50 mt-0.5" x-text="t.detail"></p>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Next Watch -->
        <section class="fade-in">
            <h3 class="text-xs font-mono uppercase tracking-widest text-black/40 mb-6">下周关注</h3>
            <div class="space-y-3">
                <template x-for="(item, i) in data.next_watch" :key="item">
                    <div class="flex items-start gap-3 py-2">
                        <span class="text-black/20 mt-0.5">→</span>
                        <p class="text-sm text-black/70" x-text="item"></p>
                    </div>
                </template>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-6 py-12 border-t border-black/5">
        <p class="text-xs font-mono text-black/25 text-center">AIGC 竞品周报 · AMS广告营销团队 · 每周一更新</p>
    </footer>

    <!-- Loading -->
    <div x-show="!data" class="flex items-center justify-center min-h-[60vh]">
        <div class="text-center">
            <div class="w-6 h-6 border border-black/20 border-t-black rounded-full animate-spin mx-auto mb-3"></div>
            <p class="text-xs text-black/30 font-mono">loading...</p>
        </div>
    </div>

    <script>
        function app() {
            return {
                data: null,
                currentWeek: '2026-05-18',
                weeks: [
                    { id: '2026-05-18', period: '2026.5.12 – 5.18' }
                ],
                async init() {
                    await this.loadWeek();
                },
                async loadWeek() {
                    try {
                        const res = await fetch(`data/weekly-${this.currentWeek}.json`);
                        this.data = await res.json();
                    } catch (e) {
                        console.error('Failed to load:', e);
                    }
                }
            }
        }
    </script>
</body>
</html>
